name: Content build

on:
  push:
    paths:
      - "tools/content_builder/**"
      - ".github/workflows/content.yml"
  workflow_dispatch:
    inputs:
      levels:
        description: "JLPT levels, comma separated (n5,n4,...)"
        default: "n5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/content_builder
    env:
      LEVELS: ${{ github.event.inputs.levels || 'n5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch sources
        run: python -m lincoin_content fetch --levels "$LEVELS"
      - name: Build content.db
        run: python -m lincoin_content build --levels "$LEVELS"
      - name: Report
        if: always()
        run: |
          test -f build/report.json && cat build/report.json || true
          test -f build/CREDITS.md && cat build/CREDITS.md || true
      - name: Sample of built content
        if: success()
        run: python tools/sample.py build/content.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-${{ env.LEVELS }}
          path: |
            tools/content_builder/build/
            tools/content_builder/.cache/manifest.json
          if-no-files-found: warn
      # The latest build is kept on the `content-build` branch (single commit,
      # replaced each time) so tools and reviewers can fetch it with git.
      - name: Publish build to content-build branch
        if: success() && github.ref != 'refs/heads/content-build'
        run: |
          set -e
          out=$(mktemp -d)
          cp build/content.db build/report.json build/CREDITS.md .cache/manifest.json "$out"/
          cd "$out"
          git init -q -b content-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Built from %s (%s) for levels %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$LEVELS" > SOURCE.txt
          git add -A
          git commit -q -m "content build $LEVELS from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" content-build
